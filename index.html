<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayorcity Voice — study notes, read aloud</title>
<style>
  :root{
    --ink:#12161c;
    --paper:#f6f1e6;
    --lamp:#e2a339;
    --lamp-dim:#a97a2c;
    --line:#2a3140;
    --panel:#171d27;
    --panel-2:#1e2530;
    --text-soft:#c9cdd6;
    --text-dim:#7c8494;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Iowan Old Style','Georgia',serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 60px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{
    width:100%;
    max-width:640px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
  }

  .brand{
    font-size:19px;
    letter-spacing:0.02em;
    font-weight:600;
    color:var(--paper);
  }
  .brand span{
    color:var(--lamp);
    font-style:italic;
  }
  .tagline{
    font-family:'Courier New',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--text-dim);
  }

  .lamp-glow{
    position:relative;
    display:flex;
    justify-content:center;
    margin:8px 0 32px;
  }
  .lamp-glow::before{
    content:"";
    position:absolute;
    top:-40px;
    width:260px;
    height:140px;
    background:radial-gradient(ellipse at center, rgba(226,163,57,0.16), transparent 70%);
    pointer-events:none;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px;
    position:relative;
  }

  label.field-label{
    display:block;
    font-family:'Courier New',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--lamp);
    margin-bottom:10px;
  }

  textarea{
    width:100%;
    min-height:220px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--paper);
    font-family:'Iowan Old Style','Georgia',serif;
    font-size:17px;
    line-height:1.6;
    padding:16px;
    resize:vertical;
    outline:none;
    transition:border-color 0.15s ease;
  }
  textarea::placeholder{color:var(--text-dim); font-style:italic;}
  textarea:focus{border-color:var(--lamp-dim);}
  textarea:focus-visible{outline:2px solid var(--lamp); outline-offset:2px;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--text-dim);
  }

  .controls{
    display:flex;
    gap:14px;
    margin-top:20px;
    flex-wrap:wrap;
    align-items:center;
  }

  select{
    background:var(--panel-2);
    color:var(--text-soft);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    font-family:'Courier New',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    outline:none;
    cursor:pointer;
  }
  select:focus-visible{outline:2px solid var(--lamp); outline-offset:2px;}

  .speed-label{
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:8px;
  }
  input[type="range"]{
    accent-color:var(--lamp);
    width:90px;
  }

  .play-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:26px;
  }

  button.play-btn{
    background:var(--lamp);
    color:#1a1204;
    border:none;
    border-radius:3px;
    padding:14px 26px;
    font-family:'Courier New',monospace;
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    cursor:pointer;
    transition:transform 0.1s ease, background 0.15s ease;
  }
  button.play-btn:hover{background:#f0b04f;}
  button.play-btn:active{transform:scale(0.97);}
  button.play-btn:disabled{
    background:var(--line);
    color:var(--text-dim);
    cursor:not-allowed;
  }
  button.play-btn:focus-visible{outline:2px solid var(--paper); outline-offset:2px;}

  button.stop-btn{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 18px;
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    cursor:pointer;
    text-transform:uppercase;
  }
  button.stop-btn:hover{color:var(--paper); border-color:var(--text-dim);}
  button.stop-btn:focus-visible{outline:2px solid var(--paper); outline-offset:2px;}

  .waveform{
    flex:1;
    display:flex;
    align-items:center;
    gap:3px;
    height:32px;
    min-width:60px;
  }
  .waveform .bar{
    width:3px;
    background:var(--line);
    border-radius:2px;
    height:6px;
    transition:height 0.15s ease, background 0.15s ease;
  }
  .waveform.active .bar{
    background:var(--lamp-dim);
    animation:pulse 900ms ease-in-out infinite;
  }
  .waveform .bar:nth-child(1){animation-delay:0ms;}
  .waveform .bar:nth-child(2){animation-delay:80ms;}
  .waveform .bar:nth-child(3){animation-delay:160ms;}
  .waveform .bar:nth-child(4){animation-delay:240ms;}
  .waveform .bar:nth-child(5){animation-delay:320ms;}
  .waveform .bar:nth-child(6){animation-delay:400ms;}
  .waveform .bar:nth-child(7){animation-delay:480ms;}
  .waveform .bar:nth-child(8){animation-delay:560ms;}
  .waveform .bar:nth-child(9){animation-delay:640ms;}
  .waveform .bar:nth-child(10){animation-delay:720ms;}
  .waveform.active .bar:nth-child(odd){background:var(--lamp);}

  @keyframes pulse{
    0%,100%{height:6px;}
    50%{height:26px;}
  }

  .status{
    margin-top:14px;
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--text-dim);
    min-height:16px;
  }

  .footnote{
    margin-top:26px;
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--text-dim);
    line-height:1.7;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .footnote strong{color:var(--lamp-dim);}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="brand">Mayorcity Voice<span>.</span></div>
      <div class="tagline">notes, read back to you</div>
    </div>
  </header>

  <div class="lamp-glow"></div>

  <div class="card">
    <label class="field-label" for="notes">Your notes</label>
    <textarea id="notes" placeholder="Paste or type your notes here. A page of lecture notes, a definition you keep forgetting, a paragraph from the textbook — anything you'd rather listen to than reread.">Mitochondria are the site of cellular respiration. They convert glucose and oxygen into ATP, the energy currency of the cell, through a process with three main stages: glycolysis, the Krebs cycle, and the electron transport chain.</textarea>
    <div class="meta-row">
      <span id="charCount">0 characters</span>
      <span>~<span id="estTime">0</span> min listen</span>
    </div>

    <div class="controls">
      <select id="voiceSelect" aria-label="Voice"></select>
      <div class="speed-label">
        speed
        <input type="range" id="speed" min="0.7" max="1.3" step="0.1" value="1">
        <span id="speedVal">1.0×</span>
      </div>
    </div>

    <div class="play-row">
      <button class="play-btn" id="playBtn">▶ Play</button>
      <button class="stop-btn" id="stopBtn">Stop</button>
      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="footnote">
    <strong>Note:</strong> this preview reads using your device's built-in voice, so you can test the flow right now. The next step swaps this for a warmer, more natural AI voice.
  </div>
</div>

<script>
  const notes = document.getElementById('notes');
  const charCount = document.getElementById('charCount');
  const estTime = document.getElementById('estTime');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const waveform = document.getElementById('waveform');
  const status = document.getElementById('status');
  const voiceSelect = document.getElementById('voiceSelect');
  const speed = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');

  const synth = window.speechSynthesis;
  let voices = [];
  let utterance = null;

  function updateMeta(){
    const len = notes.value.length;
    charCount.textContent = len + ' character' + (len === 1 ? '' : 's');
    const words = notes.value.trim() ? notes.value.trim().split(/\s+/).length : 0;
    estTime.textContent = Math.max(1, Math.round(words / 140));
  }
  notes.addEventListener('input', updateMeta);
  updateMeta();

  speed.addEventListener('input', () => {
    speedVal.textContent = parseFloat(speed.value).toFixed(1) + '×';
  });

  function populateVoices(){
    voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
    if (voices.length === 0) voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    if (voices.length === 0){
      const opt = document.createElement('option');
      opt.textContent = 'Default voice';
      voiceSelect.appendChild(opt);
      return;
    }
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = v.name;
      voiceSelect.appendChild(opt);
    });
  }
  populateVoices();
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = populateVoices;
  }

  function setPlayingState(isPlaying){
    waveform.classList.toggle('active', isPlaying);
    playBtn.disabled = isPlaying;
    playBtn.textContent = isPlaying ? '♪ Playing…' : '▶ Play';
  }

  playBtn.addEventListener('click', () => {
    const text = notes.value.trim();
    if (!text){
      status.textContent = 'Add some notes first.';
      return;
    }
    if (!synth){
      status.textContent = 'Your browser does not support voice playback.';
      return;
    }
    synth.cancel();
    utterance = new SpeechSynthesisUtterance(text);
    const chosen = voices[voiceSelect.value];
    if (chosen) utterance.voice = chosen;
    utterance.rate = parseFloat(speed.value);

    utterance.onstart = () => { setPlayingState(true); status.textContent = 'Reading your notes…'; };
    utterance.onend = () => { setPlayingState(false); status.textContent = 'Done.'; };
    utterance.onerror = () => { setPlayingState(false); status.textContent = 'Playback stopped.'; };

    synth.speak(utterance);
  });

  stopBtn.addEventListener('click', () => {
    synth.cancel();
    setPlayingState(false);
    status.textContent = 'Stopped.';
  });
</script>

</body>
</html>
